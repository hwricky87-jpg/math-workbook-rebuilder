name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Set up Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-lock.txt
          npm ci --omit=dev --ignore-scripts

      - name: Validate package
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-audit.txt
          python scripts/validate_package.py
          python -m pip check
          python -m pip_audit -r requirements-lock.txt --no-deps --progress-spinner off
          npm audit --omit=dev --audit-level=high

      - name: Run regression self-test
        run: python scripts/selftest.py --out "${{ runner.temp }}/math-workbook-rebuilder-selftest"

      - name: Test isolated Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destinationRoot = Join-Path '${{ runner.temp }}' 'isolated-skills'
          .\install.ps1 -DestinationRoot $destinationRoot -InstallDependencies
          $installed = Join-Path $destinationRoot 'math-workbook-rebuilder'
          python (Join-Path $installed 'run.py') validate_package.py

      - name: Confirm clean generated state
        run: git diff --check
